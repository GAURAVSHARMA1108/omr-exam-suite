<html lang="en">

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OMR Suite" />

    <title>OMR Exam Suite Pro - Optical Mark Grader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-slate-50 text-slate-800 antialiased font-sans select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('PWA ServiceWorker registered with scope: ', reg.scope),
            (err) => console.log('PWA ServiceWorker registration failed: ', err)
          );
        });
      }
    </script>
  </body>
